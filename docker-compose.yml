services:
  website:
    image: nginx:1.27-alpine
    container_name: fastdash-website
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8080:8080"
    environment:
      GIT_REPO: https://github.com/shdeva/FastDash.git
      GIT_BRANCH: main
      FASTDASH_DATA_DIR: /data
    volumes:
      - /REPLACE/WITH/YOUR/PERSISTENT/FASTDASH/DATA:/data:rw
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        apk add --no-cache git
        addgroup -S -g 568 fastdash 2>/dev/null || true
        adduser -S -D -H -u 568 -G fastdash fastdash 2>/dev/null || true
        mkdir -p /data/config /data/client_temp /tmp/site
        chown -R fastdash:fastdash /data
        rm -rf /tmp/source /tmp/site/*
        git clone --depth 1 --branch "$${GIT_BRANCH}" "$${GIT_REPO}" /tmp/source
        cp -a /tmp/source/. /tmp/site/
        rm -rf /tmp/site/.git
        cp /tmp/site/nginx-webdav.conf /etc/nginx/conf.d/default.conf
        chown -R fastdash:fastdash /tmp/site
        sed -i 's/^user .*/user fastdash fastdash;/' /etc/nginx/nginx.conf
        nginx -t
        exec nginx -g 'daemon off;'
    security_opt:
      - no-new-privileges:true



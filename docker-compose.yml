services:
  website:
    image: alpine:3.20
    container_name: fastdash-website
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8080:8080"
    environment:
      GIT_REPO: https://github.com/shdeva/FastDash.git
      GIT_BRANCH: main
      FASTDASH_DATA_DIR: /data
    volumes:
      - /REPLACE/WITH/YOUR/PERSISTENT/FASTDASH/DATA:/data:rw
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        apk add --no-cache git darkhttpd su-exec
        mkdir -p /data/config /tmp/site
        chown -R 568:568 /data
        rm -rf /tmp/source /tmp/site/*
        git clone --depth 1 --branch "$$GIT_BRANCH" "$$GIT_REPO" /tmp/source
        cp -a /tmp/source/. /tmp/site/
        rm -rf /tmp/site/.git
        chown -R 568:568 /tmp/site
        exec su-exec 568:568 darkhttpd /tmp/site --port 8080 --addr 0.0.0.0
    security_opt:
      - no-new-privileges:true



